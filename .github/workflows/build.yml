name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl runtime list 2>/dev/null || true

      - name: Build WatchPlayer.app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project WatchPlayer.xcodeproj \
            -target WatchPlayer \
            -configuration Release \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            TARGET_BUILD_DIR="$PWD/build/Products" \
            BUILT_PRODUCTS_DIR="$PWD/build/Products" \
            SYMROOT="$PWD/build" 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Products/WatchPlayer.app" Payload/
          zip -qry WatchPlayer-unsigned.ipa Payload
          ls -la WatchPlayer-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchPlayer-unsigned-ipa
          path: WatchPlayer-unsigned.ipa

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WatchPlayer-unsigned.ipa
